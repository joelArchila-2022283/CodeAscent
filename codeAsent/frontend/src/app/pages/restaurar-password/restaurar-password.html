<div class="bunker-recovery-container">
  <div class="recovery-card stone-panel">
    <div class="stone-emblem">⚙️</div>
    <h2 class="stone-heading">Calibrar Núcleo</h2>
    <p class="stone-desc">Ingresa tu nueva contraseña para restaurar el acceso a CodeAscent.</p>
    
    <div *ngIf="mensajeExito" class="alert alert-success">{{ mensajeExito }}</div>
    <div *ngIf="mensajeError" class="alert alert-error">{{ mensajeError }}</div>

    <form [formGroup]="restaurarForm" (ngSubmit)="onSubmit()" *ngIf="!mensajeExito && token">
      
      <div class="form-group">
        <label>Nueva Contraseña</label>
        <div style="display: flex; gap: 10px;">
          <input 
            [type]="mostrarPassword ? 'text' : 'password'" 
            formControlName="password" 
            class="stone-input" 
            placeholder="Mínimo 6 caracteres"
          >
          <button type="button" class="rock-btn" style="width: auto;" (click)="toggleMostrarPassword()">👁️</button>
        </div>
      </div>

      <div class="form-group">
        <label>Confirmar Contraseña</label>
        <input 
          [type]="mostrarPassword ? 'text' : 'password'" 
          formControlName="confirmarPassword" 
          class="stone-input" 
          placeholder="Repite la contraseña"
        >
        <div *ngIf="restaurarForm.errors?.['noCoinciden'] && restaurarForm.get('confirmarPassword')?.touched" style="color: #ff3d00; margin-top: 5px; font-size: 0.85rem;">
          Las contraseñas no coinciden.
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="rock-btn" [disabled]="restaurarForm.invalid || cargando">
          <span *ngIf="!cargando">Actualizar Contraseña</span>
          <span *ngIf="cargando">Procesando...</span>
        </button>
        <a routerLink="/login" class="back-link">← Cancelar</a>
      </div>

    </form>
  </div>
</div>
