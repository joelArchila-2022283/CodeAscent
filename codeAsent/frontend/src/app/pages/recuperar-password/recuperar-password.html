<div class="bunker-recovery-container">
  <div class="recovery-card stone-panel">
    <div class="stone-emblem">🔑</div>
    <h2 class="stone-heading">Restaurar Núcleo</h2>
    <p class="stone-desc">
      Ingresa tu correo de operador. Si existe en nuestros registros, enviaremos las coordenadas para restablecer tu clave.
    </p>
    
    <!-- Alertas -->
    <div *ngIf="mensajeExito" class="alert alert-success">{{ mensajeExito }}</div>
    <div *ngIf="mensajeError" class="alert alert-error">{{ mensajeError }}</div>

    <form [formGroup]="recuperarForm" (ngSubmit)="onSubmit()" *ngIf="!mensajeExito">
      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input 
          id="correo"
          type="email" 
          formControlName="correo" 
          class="stone-input" 
          placeholder="ejemplo@cadete.com"
        >
      </div>

      <div class="button-group">
        <button type="submit" class="rock-btn" [disabled]="recuperarForm.invalid || cargando">
          <span *ngIf="!cargando">Enviar Enlace</span>
          <span *ngIf="cargando">Transmitiendo...</span>
        </button>
        <a routerLink="/login" class="back-link">← Volver al Altar de Acceso</a>
      </div>
    </form>
  </div>
</div>
