<section class="css-section">
  <div class="section-stone-header">
    <span class="section-kicker">CSS // STYLE ENGINE ONLINE</span>
    <h2 class="stone-heading">PANEL DEL POBLADO DE LOS ESTILOS</h2>
    <p class="stone-desc">Aprende un concepto en DATA, aplícalo en TERMINAL y comprueba lo aprendido en TEST.</p>
  </div>

  <div class="stone-modules-grid">
    <button class="stone-panel-card" (click)="open('data')"><div class="panel-card__top"><span>SYS-01</span><span class="status-cyan">ONLINE</span></div><i class="bi bi-file-earmark-code-fill panel-icon-stone"></i><span class="panel-title">DATA / MANUAL CSS</span><span class="panel-text">Teoría guiada, ejemplos y pistas sobre selectores, colores, Box Model y tipografía.</span></button>
    <button class="stone-panel-card" (click)="open('processes')"><div class="panel-card__top"><span>SYS-02</span><span class="status-green">READY</span></div><i class="bi bi-gear-wide-connected panel-icon-stone"></i><span class="panel-title">PROCESSES / MISIONES</span><span class="panel-text">Convierte la teoría en objetivos concretos antes de escribir el código.</span></button>
    <button class="stone-panel-card" (click)="open('terminal')"><div class="panel-card__top"><span>SYS-03</span><span class="status-purple">LIVE</span></div><i class="bi bi-terminal-fill panel-icon-stone"></i><span class="panel-title">TERMINAL CSS</span><span class="panel-text">Resuelve ejercicios relacionados con lo estudiado y observa el resultado en vivo.</span></button>
    <button class="stone-panel-card" (click)="open('test')"><div class="panel-card__top"><span>SYS-04</span><span class="status-amber">CHECK</span></div><i class="bi bi-floppy-fill panel-icon-stone"></i><span class="panel-title">TEST / DIAGNÓSTICO</span><span class="panel-text">Comprueba si puedes reconocer y aplicar los conceptos sin copiar una solución.</span></button>
  </div>
</section>
