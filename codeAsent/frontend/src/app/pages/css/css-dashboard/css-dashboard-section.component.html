<section class="css-section">
  <div class="section-stone-header">
    <span class="section-kicker">CSS // STYLE ENGINE ONLINE</span>
    <h2 class="stone-heading">PANEL DEL POBLADO DE LOS ESTILOS</h2>
    <p class="stone-desc">Aprende un concepto en DATA, aplícalo en TERMINAL y comprueba lo aprendido en TEST.</p>
  </div>

  <div class="stone-modules-grid">
    <button class="stone-panel-card" (click)="open('data')"><div class="panel-card__top"><span>SYS-01</span><span class="status-cyan">ONLINE</span></div><i class="bi bi-file-earmark-code-fill panel-icon-stone"></i><span class="panel-title">DATA / MANUAL CSS</span><span class="panel-text">Manual técnico de 10 niveles: desde selectores y Box Model hasta Grid, responsive y animaciones.</span></button>
    <button class="stone-panel-card" (click)="open('processes')"><div class="panel-card__top"><span>SYS-02</span><span class="status-green">READY</span></div><i class="bi bi-gear-wide-connected panel-icon-stone"></i><span class="panel-title">PROCESSES / MISIONES</span><span class="panel-text">10 problemas del Poblado Antiguo conectados con el contenido de cada nivel.</span></button>
    <button class="stone-panel-card" (click)="open('terminal')"><div class="panel-card__top"><span>SYS-03</span><span class="status-purple">LIVE</span></div><i class="bi bi-terminal-fill panel-icon-stone"></i><span class="panel-title">TERMINAL CSS</span><span class="panel-text">Predice, programa, solicita pistas progresivas y recibe retroalimentación según tu solución.</span></button>
    <button class="stone-panel-card" (click)="open('test')"><div class="panel-card__top"><span>SYS-04</span><span class="status-amber">CHECK</span></div><i class="bi bi-floppy-fill panel-icon-stone"></i><span class="panel-title">TEST / DIAGNÓSTICO</span><span class="panel-text">10 preguntas alineadas con DATA y las misiones, una por cada nivel CSS.</span></button>
  </div>
</section>
