<section class="html-section test-section"><header><span class="section-kicker"><i class="bi bi-cpu-fill"></i> BIOS-TST / CALIBRACIÓN</span><h2>BALANZA DE VOLTAJE</h2><p>Responde para estabilizar el núcleo de la cámara HTML.</p></header><div class="test-panel"><div class="test-progress"><span>PRUEBA 01 / 05</span><span>20 XP</span></div><div class="html-orb"><i class="bi bi-lightning-charge-fill"></i></div><h3>{{ question }}</h3><div class="options"><button *ngFor="let option of options; let i = index" [class.selected]="selected() === i" [class.correct]="answered() && i === 0" (click)="choose(i)"><span>{{ ['A','B','C','D'][i] }}</span>{{ option }}<i *ngIf="answered() && i === 0" class="bi bi-check-circle-fill"></i></button></div>@if (answered()) { <p class="answer-note" [class.good]="selected() === 0"><i class="bi" [class.bi-check-circle-fill]="selected() === 0" [class.bi-exclamation-triangle-fill]="selected() !== 0"></i> {{ selected() === 0 ? 'Núcleo estable. Has encontrado la cámara correcta.' : 'La presión sube. Revisa la función de cada etiqueta.' }}</p> }</div><button class="html-back" (click)="back.emit()"><i class="bi bi-arrow-left"></i> VOLVER AL PANEL</button></section>
