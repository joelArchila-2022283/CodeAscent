<section class="html-section html-dashboard-section">
  <div class="section-stone-header">
    <span class="section-kicker"><i class="bi bi-broadcast-pin"></i> NÚCLEO OPERATIVO / ONLINE</span>
    <h2 class="stone-heading">PANEL DE CONTROL SUBTERRÁNEO</h2>
    <p class="stone-desc">Los sistemas de soporte vital y los conductos de data operan al 100%. Selecciona una estación de trabajo.</p>
  </div>

  <div class="stone-modules-grid">
    <button class="stone-panel-card" (click)="selectSection('data')">
      <span class="panel-card__top"><span>ARCH-01</span><i class="bi bi-circle-fill status-amber"></i></span>
      <span class="panel-icon-stone"><i class="bi bi-keyboard"></i></span>
      <span class="panel-title">Archivos de memoria</span>
      <span class="panel-text">Consulta los diagramas estructurales del lenguaje HTML en el manual antiguo.</span>
    </button>

    <button class="stone-panel-card" (click)="selectSection('processes')">
      <span class="panel-card__top"><span>BUS-IRQ</span><i class="bi bi-circle-fill status-green"></i></span>
      <span class="panel-icon-stone"><i class="bi bi-gear-wide-connected"></i></span>
      <span class="panel-title">Cola de cantera</span>
      <span class="panel-text">Ejecuta las directivas de perforación pendientes para acumular experiencia.</span>
    </button>

    <button class="stone-panel-card" (click)="selectSection('terminal')">
      <span class="panel-card__top"><span>CRT-VGA</span><i class="bi bi-circle-fill status-cyan"></i></span>
      <span class="panel-icon-stone"><i class="bi bi-display"></i></span>
      <span class="panel-title">Monitor de fósforo</span>
      <span class="panel-text">Inyecta etiquetas directamente en la consola CRT del sector HTML.</span>
    </button>

    <button class="stone-panel-card" (click)="selectSection('test')">
      <span class="panel-card__top"><span>BIOS-TST</span><i class="bi bi-circle-fill status-purple"></i></span>
      <span class="panel-icon-stone"><i class="bi bi-floppy-fill"></i></span>
      <span class="panel-title">Calibración de núcleo</span>
      <span class="panel-text">Pon a prueba tu resistencia en el simulador de fallos de voltaje.</span>
    </button>
  </div>
</section>
