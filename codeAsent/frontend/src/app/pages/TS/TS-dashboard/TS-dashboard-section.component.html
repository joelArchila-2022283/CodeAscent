<section class="ts-section ts-dashboard-section">

  <div class="section-stone-header">

    <span class="section-kicker">
      <i class="bi bi-broadcast-pin"></i>

      NÚCLEO TYPESCRIPT / ONLINE
    </span>

    <h2 class="stone-heading">
      PANEL DE CONTROL TYPESCRIPT
    </h2>

    <p class="stone-desc">
      Los sistemas de compilación y ejecución TypeScript operan al 100%.
      Selecciona una estación de trabajo.
    </p>

  </div>


  <div class="stone-modules-grid">


    <button
      class="stone-panel-card"
      (click)="selectSection('data')">

      <span class="panel-card__top">

        <span>
          ARCH-04
        </span>

        <i class="bi bi-circle-fill status-amber"></i>

      </span>


      <span class="panel-icon-stone">
        <i class="bi bi-filetype-ts"></i>
      </span>


      <span class="panel-title">
        Archivos TypeScript
      </span>


      <span class="panel-text">
        Consulta conceptos, estructuras y tipos fundamentales
        del lenguaje TypeScript.
      </span>

    </button>



    <button
      class="stone-panel-card"
      (click)="selectSection('processes')">

      <span class="panel-card__top">

        <span>
          BUS-IRQ
        </span>

        <i class="bi bi-circle-fill status-green"></i>

      </span>


      <span class="panel-icon-stone">
        <i class="bi bi-gear-wide-connected"></i>
      </span>


      <span class="panel-title">
        Procesos TypeScript
      </span>


      <span class="panel-text">
        Ejecuta procesos y experimenta con estructuras
        del lenguaje TypeScript.
      </span>

    </button>



    <button
      class="stone-panel-card"
      (click)="selectSection('terminal')">

      <span class="panel-card__top">

        <span>
          CRT-VGA
        </span>

        <i class="bi bi-circle-fill status-cyan"></i>

      </span>


      <span class="panel-icon-stone">
        <i class="bi bi-display"></i>
      </span>


      <span class="panel-title">
        Terminal TypeScript
      </span>


      <span class="panel-text">
        Escribe, compila y ejecuta código TypeScript
        directamente en la consola CRT.
      </span>

    </button>



    <button
      class="stone-panel-card"
      (click)="selectSection('test')">

      <span class="panel-card__top">

        <span>
          BIOS-TST
        </span>

        <i class="bi bi-circle-fill status-purple"></i>

      </span>


      <span class="panel-icon-stone">
        <i class="bi bi-floppy-fill"></i>
      </span>


      <span class="panel-title">
        Prueba TypeScript
      </span>


      <span class="panel-text">
        Pon a prueba tus conocimientos sobre tipos,
        funciones, interfaces y estructuras TypeScript.
      </span>

    </button>


  </div>

</section>
