<section class="ts-section process-section">
  <header>
    <span class="section-kicker">
      <i class="bi bi-tools"></i>
      MISIONES ACTIVAS
    </span>

    <h2>SELECCIÓN DE MISIÓN</h2>

    <p>
      Completa cada misión TypeScript para abrir nuevas cámaras de conocimiento.
    </p>
  </header>

  <p *ngIf="cargando()">
    Cargando misiones...
  </p>

  <p *ngIf="errorCarga()" role="alert">
    {{ errorCarga() }}
  </p>

  <div class="mission-list">

    <button
      class="mission"
      *ngFor="let mission of missions()"
      type="button"
      (click)="seleccionarMision(mission)"
    >

      <span class="mission-icon">
        <i class="bi bi-door-open"></i>
      </span>

      <span class="mission-copy">

        <small>
          {{ mission.code }}
        </small>

        <strong>
          {{ mission.title }}
        </strong>

        <span>
          {{ mission.detail }}
        </span>

      </span>

      <span class="mission-reward">
        MISIÓN {{ mission.id }}
      </span>

    </button>

  </div>

  <button
    class="ts-back"
    type="button"
    (click)="back.emit()"
  >
    <i class="bi bi-arrow-left"></i>
    VOLVER AL PANEL
  </button>

</section>
