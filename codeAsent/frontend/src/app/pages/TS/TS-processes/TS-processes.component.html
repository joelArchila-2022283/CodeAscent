<section class="ts-section process-section">

    <header>
        <span class="section-kicker">
            <i class="bi bi-tools"></i>
            COLA DE CANTERA / 03 DIRECTIVAS
        </span>

        <h2>PROCESOS TYPESCRIPT ACTIVOS</h2>

        <p>
            Completa cada misión para abrir nuevas cámaras de conocimiento TypeScript.
        </p>
    </header>

    <div class="mission-list">

        <button class="mission" *ngFor="let mission of missions" [class.done]="completed().includes(mission.id)"
            (click)="toggleMission(mission.id)" type="button">

            <span class="mission-icon">
                <i class="bi" [class]="mission.icon"></i>
            </span>

            <span class="mission-copy">
                <small>{{ mission.code }}</small>

                <strong>{{ mission.title }}</strong>

                <span>{{ mission.detail }}</span>
            </span>

            <span class="mission-reward">
                {{ completed().includes(mission.id) ? 'LISTO' : mission.reward }}

                <i class="bi" [class.bi-check-circle-fill]="completed().includes(mission.id)"
                    [class.bi-lock-fill]="!completed().includes(mission.id)">
                </i>
            </span>

        </button>

    </div>

    <button class="ts-back" type="button" (click)="back.emit()">

        <i class="bi bi-arrow-left"></i>
        VOLVER AL PANEL

    </button>

</section>
