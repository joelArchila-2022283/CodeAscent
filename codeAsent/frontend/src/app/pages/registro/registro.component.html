<div class="auth-container">
  <div class="auth-split">
    
    <!-- Columna Izquierda: Formulario de Registro -->
    <div class="auth-form-pane">
      <div class="auth-header">
        <h2 class="auth-title">CREAR CUENTA</h2>
        <div class="auth-sub">- EMPIEZA TU TRAVESÍA -</div>
      </div>

      <div *ngIf="mensajeError" class="error-alert">
        {{ mensajeError }}
      </div>

      <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="registro-form">
        
        <!-- Campo Usuario -->
        <div class="campo-grupo">
          <label>USUARIO</label>
          <input 
            type="text" 
            formControlName="usuario" 
            placeholder="player_01"
            [class.input-error]="registroForm.controls['usuario'].invalid && registroForm.controls['usuario'].touched">
        </div>
        
        <!-- Campo Correo -->
        <div class="campo-grupo">
          <label>CORREO</label>
          <input 
            type="email" 
            formControlName="correo" 
            placeholder="tu@correo.com"
            [class.input-error]="registroForm.controls['correo'].invalid && registroForm.controls['correo'].touched">
        </div>
        
        <!-- Campo Contraseña con Ojito -->
        <div class="campo-grupo">
          <label>CONTRASEÑA</label>
          <div class="input-password-wrapper">
            <input 
              [type]="mostrarPassword ? 'text' : 'password'" 
              formControlName="password" 
              placeholder="••••••••"
              [class.input-error]="registroForm.controls['password'].invalid && registroForm.controls['password'].touched">
            
            <button 
              type="button" 
              class="btn-ojo" 
              (click)="toggleMostrarPassword()"
              [class.activo]="mostrarPassword"
              title="Mostrar u ocultar clave">
              <svg class="icono-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path class="ojo-base" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle class="ojo-pupila" cx="12" cy="12" r="3"></circle>
                <line class="ojo-linea" x1="3" y1="3" x2="21" y2="21" *ngIf="!mostrarPassword"></line>
              </svg>
            </button>
          </div>
        </div>
        
        <!-- Términos -->
        <div class="opciones-fila">
          <label class="checkbox-container">
            <input type="checkbox" formControlName="terminos">
            <span>Acepto términos y condiciones</span>
          </label>
        </div>

        <!-- Botón Crear Cuenta -->
        <button type="submit" class="btn-principal" [disabled]="cargando">
          {{ cargando ? 'CREANDO...' : 'CREAR CUENTA ▶' }}
        </button>

        <div class="divisor-retro"><span>O</span></div>

        <!-- Contenedor Oficial Google Sign-In -->
        <div id="googleBtnRegister" class="google-btn-wrapper"></div>

        <div class="registro-pie">
          ¿Ya tienes cuenta? 
          <a routerLink="/login" class="link-destacado">Inicia sesión</a>
        </div>
      </form>
    </div>

    <!-- Columna Derecha: Video Frame -->
    <div class="auth-video-pane">
      <div class="film-corner tl">ESCENA 02</div>
      <div class="film-corner tr">
        <span class="rec-dot"></span>LOOP
      </div>
      
      <video 
        #videoPlayer
        autoplay 
        loop 
        [muted]="true" 
        playsinline 
        preload="auto"
        class="video-fondo">
        <source src="assets/videos/register-scene.mp4" type="video/mp4">
      </video>

      <div class="auth-frame-caption">
        <div class="cap-title">CODE ASCENT</div>
        <div class="cap-sub">¡ÚNETE A LA AVENTURA!</div>
      </div>
    </div>

  </div>
</div>
